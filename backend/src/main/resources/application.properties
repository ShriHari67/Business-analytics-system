# ====================================================================
# BUSINESS ANALYTICS SYSTEM - SPRING BOOT CONFIGURATION
# ====================================================================

spring.application.name=business-analytics-system
server.port=8080
server.servlet.context-path=/

# Active Profile (defaults to 'dev' for immediate out-of-the-box in-memory startup)
spring.profiles.active=dev

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.businessanalytics.system=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
